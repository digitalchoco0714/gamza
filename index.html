<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자(Gamza) - 포근한 우리 동네 중고거래</title>
  <!-- 공통 디자인 시스템 및 화면별 스타일시트 -->
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/list.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/write.css" />
</head>
<body>
  <!-- [화면 1] 상품 목록 메인 컨테이너 -->
  <div id="list-screen"></div>

  <!-- [화면 2] 상품 상세 팝업 모달 -->
  <div id="detail-modal" class="modal-overlay" aria-hidden="true"></div>

  <!-- [화면 3] 글쓰기(상품 등록) 모달 -->
  <div id="write-modal" class="modal-overlay" aria-hidden="true"></div>

  <!-- 공통 설정, 데이터 스토어 및 화면별 스크립트 -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/list.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/write.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.GamzaList) window.GamzaList.init();
      if (window.GamzaDetail) window.GamzaDetail.init();
      if (window.GamzaWrite) window.GamzaWrite.init();
    });
  </script>
</body>
</html>
